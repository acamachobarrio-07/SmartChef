spring.application.name=SmartChef

spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Usa 'update' para que cree/modifique tablas automáticamente,
# o usa 'none' para que Hibernate NO valide ni toque el esquema SQL existente.
# Desactiva la validación explicita del esquema
spring.jpa.properties.hibernate.hbm2ddl.auto=update

# --- Conexion a la base de datos -----------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# --- JPA / Hibernate -----------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# --- Servidor ------------------------------------------------
server.port=8080
